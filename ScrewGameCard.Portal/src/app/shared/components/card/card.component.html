<p-card [attr.aria-labelledby]="headerId">
  @if (header) {
    <ng-template pTemplate="header">
      <div [id]="headerId">
        <ng-content select="[card-header]"></ng-content>
      </div>
    </ng-template>

  }
  <ng-content></ng-content>
  @if (footer) {
    <ng-template pTemplate="footer">
      <ng-content select="[card-footer]"></ng-content>
    </ng-template>
  }
</p-card>
