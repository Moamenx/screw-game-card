<aside class="sidebar" [class.collapsed]="collapsed">

    <a class="nav-link" routerLink="/home" routerLinkActive="active" [attr.aria-label]="'SIDEBAR.HOME' | translate">
      <span>🏠</span> @if (!collapsed) { <span>{{ 'SIDEBAR.HOME' | translate }}</span> }
    </a>
    <a class="nav-link" routerLink="/lobby" routerLinkActive="active" [attr.aria-label]="'SIDEBAR.LOBBY' | translate">
      <span>🎮</span> @if (!collapsed) { <span>{{ 'SIDEBAR.LOBBY' | translate }}</span> }
    </a>
    <a class="nav-link" routerLink="/profile" routerLinkActive="active" [attr.aria-label]="'SIDEBAR.PROFILE' | translate">
      <span>👤</span> @if (!collapsed) { <span>{{ 'SIDEBAR.PROFILE' | translate }}</span> }
    </a>
  </nav>
</aside>
