<p-button
  [icon]="icon ? 'pi pi-' + icon : ''"
  [severity]="type === 'danger' ? 'danger' : type === 'success' ? 'success' : type"
  [size]="size === 'lg' ? 'large' : size === 'sm' ? 'small' : 'small'"
  [disabled]="disabled"
  [ariaLabel]="ariaLabel"
  (onClick)="onClick()"
  type="button"
>
  <ng-content></ng-content>
</p-button>
