<header class="header">
  <div class="brand">
    <button class="menu-btn" (click)="toggleSidebar.emit()" [attr.aria-label]="'HEADER.TOGGLE_SIDEBAR' | translate">
      <span>☰</span>
    </button>
    <span class="brand-text">{{ 'HEADER.BRAND' | translate }}</span>
  </div>
  
  <div class="actions">
    <button class="theme-toggle" (click)="languageService.toggleLanguage()" [attr.aria-label]="'HEADER.TOGGLE_LANGUAGE' | translate">
      {{ languageService.currentLang() === 'en' ? 'ع' : 'EN' }}
    </button>
    <button class="theme-toggle" (click)="themeService.toggleTheme()" [attr.aria-label]="'HEADER.TOGGLE_THEME' | translate">
      {{ themeService.theme === 'light' ? '🌙' : '☀️' }}
    </button>
  </div>
</header>
