<div class="app-layout">
  <app-header (toggleSidebar)="sidebarCollapsed = !sidebarCollapsed"></app-header>

  <app-sidebar [class.open]="!sidebarCollapsed"></app-sidebar>
  
  <main class="content">

  </main>
  
  <app-footer></app-footer>
</div>
