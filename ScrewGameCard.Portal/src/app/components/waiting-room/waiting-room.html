<div class="waiting-room-container">
  <h2>Waiting Room</h2>
  
  <div class="players-list">
    <h3>Connected Players</h3>
    <ul>
      <li *ngFor="let player of players()">
        {{ player.name }} {{ isHost() ? '(Host)' : '' }}
      </li>
    </ul>
  </div>

  <div class="actions">
    <button *ngIf="isHost()" (click)="startGame()" [disabled]="players().length < 2">
      Start Game
    </button>
    <button class="leave-btn" (click)="leaveGame()">Leave Game</button>
  </div>

  <div *ngIf="isHost() && players().length < 2" class="info-message">
    Waiting for more players to join...
  </div>
</div>
