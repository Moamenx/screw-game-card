<div class="game-room-container">
  <div class="game-header">
    <h2>Screw Card Game</h2>
    <button class="leave-btn" (click)="leaveGame()">Leave Game</button>
  </div>

  <div class="players-area">
    <div *ngFor="let player of players()" class="player-info">
      {{ player.name }}
    </div>
  </div>

  <div class="game-area">
    <div class="card-table">
      <!-- Center play area will show played cards -->
    </div>

    <div class="player-hand">
      <div class="cards">
        <div *ngFor="let card of currentPlayerCards" 
             class="card"
             [class.selected]="selectedCard === card"
             (click)="onCardSelected(card)">
          {{ card.value }} of {{ card.suit }}
        </div>
      </div>
      <button *ngIf="selectedCard" 
              (click)="playCard()"
              class="play-btn">
        Play Card
      </button>
    </div>
  </div>
</div>
